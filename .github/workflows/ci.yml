name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Tests + coverage
        shell: bash
        run: npm test 2>&1 | tee test-output.txt
      - name: Auth benchmark
        shell: bash
        run: npm run bench | tee bench-output.txt
      - name: Publish results to job summary
        if: always()
        run: |
          {
            echo "## Test coverage"; echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed 's/^# //'
            echo '```'; echo "## Auth benchmark"; echo '```'; cat bench-output.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
